<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Gym Chatbot</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="bg-neutral-900 text-white h-screen flex justify-center">
  <div class="w-full max-w-xl flex flex-col">

    <header class="p-4 border-b border-neutral-700 flex items-center gap-3">
      <div class="w-10 h-10 rounded-xl bg-orange-500 flex items-center justify-center">
        <svg
          class="w-6 h-6 text-white"
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="2"
          stroke-linecap="round"
          stroke-linejoin="round"
        >
          <path d="M3.5 9v6" />
          <path d="M6.5 6.5v11" />
          <path d="M6.5 12h11" />
          <path d="M17.5 6.5v11" />
          <path d="M20.5 9v6" />
        </svg>
      </div>
      <div>
        <h1 class="font-semibold leading-tight">Gym Assistant</h1>
        <p class="text-xs text-neutral-400">Workout • Diet • BMI</p>
      </div>
    </header>

    <div id="messages" class="flex-1 overflow-y-auto p-4 space-y-3">
      <div class="mr-auto max-w-[80%] bg-neutral-800 p-3 rounded-2xl">
        Hey! I'm your gym assistant. Ask me anything about workouts, diet or BMI.
      </div>
    </div>

    <div class="p-3 border-t border-neutral-700 flex gap-2">
      <input
        id="input"
        class="flex-1 p-3 rounded-lg bg-neutral-800 outline-none"
        placeholder="Ask about workouts, diet..."
        autocomplete="off"
      />
      <button id="send" class="px-5 rounded-lg bg-orange-500 hover:bg-orange-400 disabled:opacity-50">
        Send
      </button>
    </div>

  </div>

  <script>
    const input = document.getElementById("input");
    const sendBtn = document.getElementById("send");
    const messages = document.getElementById("messages");

    const history = [];
    let isLoading = false;

    function addMessage(text, who) {
      const div = document.createElement("div");
      div.className =
        who === "user"
          ? "ml-auto max-w-[80%] bg-orange-500 p-3 rounded-2xl"
          : "mr-auto max-w-[80%] bg-neutral-800 p-3 rounded-2xl whitespace-pre-wrap";
      div.textContent = text;
      messages.appendChild(div);
      messages.scrollTop = messages.scrollHeight;
      return div;
    }

    async function handleSend() {
      if (isLoading) return; // jawab aane tak dusri request nahi

      const text = input.value.trim();
      if (!text) return;

      isLoading = true;
      sendBtn.disabled = true;

      addMessage(text, "user");
      history.push({ role: "user", content: text });
      input.value = "";

      const loadingEl = addMessage("Typing...", "bot");

      try {
        const res = await fetch("/chat", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ messages: history.slice(-20) }),
        });
        const data = await res.json();
        if (!res.ok) throw new Error(data.error || "Request failed");

        loadingEl.textContent = data.reply;
        history.push({ role: "assistant", content: data.reply });
      } catch (err) {
        loadingEl.textContent = "Oops, something went wrong. Please try again.";
      } finally {
        isLoading = false;
        sendBtn.disabled = false;
        input.focus();
      }
    }

    sendBtn.addEventListener("click", handleSend);
    input.addEventListener("keydown", (e) => {
      if (e.key === "Enter") handleSend();
    });
  </script>
</body>
</html>
